<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SocialApp – Feed</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">SocialApp</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">Feed</a></li>
          <li class="nav-item"><a class="nav-link" href="../profile/index.html">Profile</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <div class="row mb-4 g-2">
      <div class="col-md-6">
        <input type="search" class="form-control" placeholder="Search posts..." />
      </div>
      <div class="col-md-3">
        <select class="form-select">
          <option>Newest</option>
          <option>Oldest</option>
          <option>Most liked</option>
        </select>
      </div>
    </div>

    <div class="card p-3 mb-4">
      <h2 class="h6">Create a new post</h2>
      <form>
        <div class="mb-2">
          <input type="text" class="form-control" placeholder="Title" required />
        </div>
        <div class="mb-2">
          <textarea class="form-control" rows="2" placeholder="What's on your mind?"></textarea>
        </div>
        <div class="mb-2">
          <label for="postImage" class="form-label">Add image</label>
          <input type="file" class="form-control" id="postImage" accept="image/*" />
        </div>
        <button type="submit" class="btn btn-primary btn-sm">Post</button>
      </form>
    </div>

    <div class="row g-4">
      <div class="col-md-4">
        <div class="card h-100">
          <img src="https://picsum.photos/id/1015/400/250" class="card-img-top" alt="Post thumbnail" />
          <div class="card-body">
            <h5 class="card-title">First post</h5>
            <p class="card-text text-muted">Short excerpt of the post content...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
